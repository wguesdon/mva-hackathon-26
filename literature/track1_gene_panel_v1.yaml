# The MVA gene panel of Track 1, frozen from one ontology release.
#
# scripts/build_track1_gene_panel.py writes this file and `check` refuses a file that the
# frozen release no longer produces. harness/test_track1_gene_panel.py holds the two code
# constants to the operating sets below, so a gene set cannot move in the code alone.
#
# Do not edit this file by hand. Edit the rule or the manual addition list in the script.
panel_id: track1_gene_panel_v1
inclusion_rule: 'A gene enters this panel when the Human Phenotype Ontology release v2026-09-01 links
  it to a disease whose name matches the regular expression ''mosaic variegated aneuploidy'', case insensitive.
  The disease names come from phenotype.hpoa of that release and the gene to disease links from genes_to_disease.txt
  of the same release. The association_type of the link gives the tier: MENDELIAN is tier 1 and any
  other value is tier 2.'
source:
  name: Human Phenotype Ontology
  release: v2026-09-01
  directory: tracking/cache/hpo_v2026_09_01
  files:
    genes_to_disease.txt: 7937a1b92779dc8614e39ace623b443c7c71dd15e4de11d5e52b14e331ab5978
    phenotype.hpoa: e89aa39c8f97bf5a52c5d160f9250a603681d630ade8ec2679d84ac5aece1f72
  citation: PMID 37953324
generated_by: scripts/build_track1_gene_panel.py
matching_diseases:
  OMIM:257300: Mosaic variegated aneuploidy syndrome 1
  OMIM:614114: Mosaic variegated aneuploidy syndrome 2
  OMIM:617598: Mosaic variegated aneuploidy syndrome 3
  OMIM:620153: Mosaic variegated aneuploidy syndrome 4
  OMIM:620189: Mosaic variegated aneuploidy syndrome 7 with inflammation and tumor predisposition
  ORPHA:1052: Mosaic variegated aneuploidy syndrome
panel:
  BUB1:
    ncbi_gene_id: NCBIGene:699
    tier: 2
    links:
    - disease_id: ORPHA:1052
      disease_name: Mosaic variegated aneuploidy syndrome
      association_type: UNKNOWN
      source: http://www.orphadata.org/data/xml/en_product6.xml
  BUB1B:
