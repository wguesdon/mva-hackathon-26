    tier: 1
    links:
    - disease_id: OMIM:257300
      disease_name: Mosaic variegated aneuploidy syndrome 1
      association_type: MENDELIAN
      source: ftp://ftp.ncbi.nlm.nih.gov/gene/DATA/mim2gene_medgen
    - disease_id: ORPHA:1052
      disease_name: Mosaic variegated aneuploidy syndrome
      association_type: UNKNOWN
      source: http://www.orphadata.org/data/xml/en_product6.xml
  BUB3:
    ncbi_gene_id: NCBIGene:9184
    tier: 2
    links:
    - disease_id: ORPHA:1052
      disease_name: Mosaic variegated aneuploidy syndrome
      association_type: UNKNOWN
      source: http://www.orphadata.org/data/xml/en_product6.xml
  CENATAC:
    ncbi_gene_id: NCBIGene:338657
    tier: 1
    links:
    - disease_id: OMIM:620153
      disease_name: Mosaic variegated aneuploidy syndrome 4
      association_type: MENDELIAN
      source: ftp://ftp.ncbi.nlm.nih.gov/gene/DATA/mim2gene_medgen
  CEP57:
    ncbi_gene_id: NCBIGene:9702
    tier: 1
    links:
    - disease_id: OMIM:614114
      disease_name: Mosaic variegated aneuploidy syndrome 2
      association_type: MENDELIAN
      source: ftp://ftp.ncbi.nlm.nih.gov/gene/DATA/mim2gene_medgen
    - disease_id: ORPHA:1052
      disease_name: Mosaic variegated aneuploidy syndrome
      association_type: UNKNOWN
