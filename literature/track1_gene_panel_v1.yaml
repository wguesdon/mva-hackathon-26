set_rules:
  established_disease_gene_set: Every tier 1 gene of the panel whose disease is one of OMIM:257300,
    OMIM:614114 and OMIM:617598, which are mosaic variegated aneuploidy syndrome 1, 2 and 3. These are
    the three genes that a published case series reports with a biallelic genotype and a confirmed diagnosis.
  forced_genotyping_target_list: The established disease gene set plus every gene of the manual addition
    list whose set field names this list. The addition rule is a published biallelic genotype in a person
    with a mosaic variegated aneuploidy phenotype, with the PMID recorded beside the gene.
  structural_annotation_set: The established disease gene set plus every gene of the manual addition
    list whose set field names this list. The addition rule is membership of the spindle assembly checkpoint,
    because a structural event in a checkpoint component is the class of second hit that this arm looks
    for. *SMC5* is a structural maintenance of chromosomes protein and not a checkpoint component, so
    the rule excludes it from this set and admits it to the forced genotyping list.
manual_additions:
  SMC5:
    set: forced_genotyping_target_list
    evidence: PMID 41374403
    reason: The literature seed resolved two biallelic *SMC5* alleles in a family with near-tetraploidy
      and mosaic variegated aneuploidy. The frozen release links SMC5 to no disease whose name matches
      the panel rule.
  BUB1:
    set: structural_annotation_set
    evidence: ORPHA:1052 of the frozen release
    reason: A spindle assembly checkpoint component. It is tier 2 of the panel, so the frozen release
      supports it and the panel rule admits it.
  BUB3:
    set: structural_annotation_set
    evidence: ORPHA:1052 of the frozen release
    reason: A spindle assembly checkpoint component. It is tier 2 of the panel, so the frozen release
      supports it and the panel rule admits it.
  CDC20:
    set: structural_annotation_set
    evidence: None in the frozen release
    reason: A spindle assembly checkpoint component and the target of the checkpoint complex. The frozen
      release links CDC20 to no disease whose name matches the panel rule, so this member rests on the
      manual addition rule alone.
  PTPA:
    set: structural_annotation_set
    evidence: None in the frozen release
    reason: A regulator of protein phosphatase 2A, which acts on the checkpoint. The frozen release
      links PTPA to no disease whose name matches the panel rule, so this member rests on the manual
      addition rule alone.
operating_sets:
  established_disease_gene_set:
  - BUB1B
  - CEP57
  - TRIP13
  forced_genotyping_target_list:
  - BUB1B
  - CEP57
  - TRIP13
  - SMC5
  structural_annotation_set:
  - BUB1B
  - CEP57
  - TRIP13
  - BUB1
  - BUB3
  - CDC20
  - PTPA
differences_against_the_panel:
  in_the_panel_and_in_no_operating_set:
  - CENATAC
  - MAD1L1
  in_an_operating_set_and_not_in_the_panel:
  - CDC20
  - PTPA
  - SMC5
consumers:
  pipelines/sv_mei_annotate/bin/annotate_sv_mei.py:
    constant: MVA_GENES
    set: structural_annotation_set
  scripts/build_s6_targets.py:
    constant: GENES
    set: forced_genotyping_target_list
test: harness/test_track1_gene_panel.py
