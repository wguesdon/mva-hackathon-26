# This file defines the screening inputs. It contains no ranked results.
definition_version: 1
enumeration_rule:
  statement: A published biochemical route converts the substance to NAD+ in a human
    cell, or the substance is NAD+. SIRT2 consumes NAD+ when it deacetylates BubR1
    at Lys668, so the NAD+ pool is the named molecular input of the one published
    route that raises BubR1.
  route_references:
  - pmid: 18429699
    covers: The de novo route from tryptophan, the Preiss-Handler route from nicotinic
      acid and the salvage route from nicotinamide
  - pmid: 15137942
    covers: The nicotinamide riboside kinase route to nicotinamide mononucleotide
  - pmid: 34866305
    covers: The conversion of nicotinamide mononucleotide to NAD+ by nicotinamide
      mononucleotide adenylyltransferase
  - pmid: 24825348
    covers: The NAD+ dependent deacetylation of BubR1 at Lys668 by SIRT2
criteria:
  C1:
    statement: The compound raises a named molecular input of the one published route
      that raises BubR1.
    test: The enumeration rule above.
  C2:
    statement: The compound does not inhibit a sirtuin.
    test: No publication reports inhibition of a sirtuin by the substance at a concentration
      that an authorized dose reaches.
  C3:
    statement: Exclude checkpoint weakening agents, compounds whose cytotoxicity requires
      an intact checkpoint, CENP-E inhibitors and aneuploidy selective compounds.
    test: The substance is not a checkpoint weakening agent, not an agent whose cytotoxicity
      needs an intact checkpoint, not a CENP-E inhibitor and not an aneuploidy selective
      compound.
  C4:
    statement: The route reaches a systemic compartment under repeat dosing.
    test: An authorized product delivers the substance by the oral route or by a parenteral
      route.
regulatory_states:
- APPROVED_SINGLE_SUBSTANCE
- APPROVED_COMBINATION_ONLY
- WITHDRAWN
- INVESTIGATIONAL
- NOT_A_MEDICINE
acceptable_routes:
- ORAL
- INTRAVENOUS
- INJECTION
- INTRAMUSCULAR
- SUBCUTANEOUS
