  - form: "mitotic"
    mentions: 23
    accepted: 0
    verdict: rejected
    reason: >-
      The adjective alone. It qualifies a process and it names no disease.
  - form: "mitotic abnormality"
    mentions: 7
    accepted: 0
    verdict: rejected
    reason: >-
      The singular of "mitotic abnormalities" and the same cell biology observation.
  - form: "variegated aneuploidy syndrome"
    mentions: 6
