closure_gates:
  G1: No panel gene is outside every operating set.
  G2: Every operating set member is a panel gene or a declared addition with a reason and an evidence
    field.
  G3: Every declared consumer constant equals the operating set that the panel derives for it.
  G4: Every gene of the evidence file whose disease identifier is a disease of the matching set is a
    panel gene.
  G5: Every gene of the evidence file that carries a published case is in at least one operating set.
