shipped_panel_version:
  version: v1
  reason: Every consumer keeps its shipped default at the v1 tuple, because the runs that produced the
    submission used the v1 sets and queue row R30 blocks every patient rerun until the compliance question
    closes. The v2 tuple is in the code, the test holds it to this panel, and the change of the shipped
    default is an owner decision that queue row R33 records.
