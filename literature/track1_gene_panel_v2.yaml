# The MVA gene panel of Track 1, version 2, frozen from one ontology release.
#
# This file supersedes literature/track1_gene_panel_v1.yaml. Version v1 stays in the
# repository and it still reproduces, because every receipt of the recorded runs cites it.
#
# scripts/build_track1_gene_panel.py --panel-version v2 writes this file and `check`
# refuses a file that the frozen release, the surface form file and the evidence file no
# longer produce. Five closure gates run on every write and on every check, and
# harness/test_track1_gene_panel.py runs the same gates.
#
# Do not edit this file by hand. Edit the surface form file, the gene seed or the
# declared addition list in the script.
panel_id: track1_gene_panel_v2
supersedes: track1_gene_panel_v1
inclusion_rule: 'A gene enters this panel when the Human Phenotype Ontology release v2026-09-01 links
  it to a disease whose name matches a declared surface form of literature/track1_mva_disease_surface_forms_v1.yaml,
  case insensitive. The disease names come from phenotype.hpoa of that release and the gene to disease
  links from genes_to_disease.txt of the same release. The association_type of the link gives the tier:
  MENDELIAN is tier 1 and any other value is tier 2. Panel version v1 held one regular expression inside
  the builder, ''mosaic variegated aneuploidy''. That form missed OMIM:620184 and OMIM:620185, which
  the same release names Atelis syndrome 1 and Atelis syndrome 2, and OMIM:253250, which it names Mulibrey
  nanism.'
correction: The round 4 panel check reported CENATAC and MAD1L1 as panel genes that no operating set
  holds. The cause is the established clause of version v1, which enumerated OMIM:257300, OMIM:614114
  and OMIM:617598 and therefore excluded every mosaic variegated aneuploidy subtype that OMIM added
  after subtype 3. Version v2 replaces the enumeration by the property that the release links the gene
  with the association type MENDELIAN to an OMIM phenotype of a surface form group that admits to the
  established set. Version v2 also declares three further consumers, because the gene tuple of scripts/build_spikein_suite.py,
  scripts/build_r12_targets.py and scripts/track1_sv_benchmark.py was an undeclared copy that no test
  checked.
