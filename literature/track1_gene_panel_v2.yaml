set_rules:
  established_disease_gene_set: Every gene that the frozen release links with the association type MENDELIAN
    to an OMIM phenotype whose name matches a surface form group of literature/track1_mva_disease_surface_forms_v1.yaml
    whose admits_to_the_established_disease_gene_set field is true. The order is the ascending OMIM
    entry number of the matching phenotype of each gene. Panel version v1 wrote this rule as the enumeration
    OMIM:257300, OMIM:614114 and OMIM:617598, and that enumeration is the mechanism that held CENATAC
    and MAD1L1 out of every operating set.
  forced_genotyping_target_list: The established disease gene set plus every gene of the declared addition
    list whose sets field names this list. The addition rule is a published biallelic genotype in a
    person with a mosaic variegated aneuploidy or a mosaic variegated hyperploidy phenotype, with the
    PMID recorded beside the gene in literature/track1_mva_gene_evidence_v1.yaml.
  structural_annotation_set: The established disease gene set plus every gene of the declared addition
    list whose sets field names this list. The addition rule is membership of the spindle assembly checkpoint,
    because a structural event in a checkpoint component is the class of second hit that this arm looks
    for. SMC5, SLF2, CEP192 and TRIM37 are not checkpoint components, so the rule excludes each one
    from this set and admits each one to the forced genotyping list. MAD2L1BP silences the checkpoint,
    so the rule admits it to both.
  benchmark_mva_gene_set: The established disease gene set. scripts/build_spikein_suite.py reads it
    to decide which gene of the public spike-in suite carries the mva_clinvar and the mva_literature
    group label and which gene is eligible for the recessive_clinvar group. Panel version v1 held this
    list as an undeclared third copy of the three established genes, so the panel test did not check
    it and the suite carried no CENATAC and no MAD1L1 scenario.
declared_additions:
  SMC5:
    sets:
    - forced_genotyping_target_list
    evidence: OMIM:620185 of the frozen release and PMID 41374403
    reason: A panel gene of the related chromosomal instability group. The frozen release links SMC5
      to OMIM:620185, Atelis syndrome 2, with the association type MENDELIAN, and PMID 41374403 reports
      two biallelic SMC5 alleles in a family with near-tetraploidy and mosaic variegated aneuploidy.
      SMC5 is a structural maintenance of chromosomes protein and not a spindle assembly checkpoint
      component, so the structural annotation rule excludes it.
  SLF2:
    sets:
    - forced_genotyping_target_list
    evidence: OMIM:620184 of the frozen release and PMID 36333305
    reason: A panel gene of the related chromosomal instability group. The frozen release links SLF2
      to OMIM:620184, Atelis syndrome 1, with the association type MENDELIAN, and PMID 36333305 reports
      7 patients from 5 families with a biallelic SLF2 genotype and mosaic variegated hyperploidy. SLF2
      is a component of the RAD18-SLF1/2-SMC5/6 pathway and not a spindle assembly checkpoint component,
      so the structural annotation rule excludes it. Panel version v1 held SLF2 in no set, because its
      one regular expression did not match the disease name Atelis syndrome 1.
  TRIM37:
    sets:
    - forced_genotyping_target_list
    evidence: OMIM:253250 of the frozen release and PMID 41702694
    reason: A panel gene of the related chromosomal instability group. The frozen release links TRIM37
      to OMIM:253250, Mulibrey nanism, with the association type MENDELIAN, and PMID 41702694 reports
      mosaic variegated aneuploidy in 7 to 36 percent of metaphases in 2 siblings with a biallelic TRIM37
      genotype. TRIM37 is a tripartite motif protein and not a spindle assembly checkpoint component,
      so the structural annotation rule excludes it.
  MAD2L1BP:
    sets:
    - forced_genotyping_target_list
    - structural_annotation_set
    evidence: PMID 37796616
    reason: A published mosaic aneuploidy gene that the frozen release links to no disease. PMID 37796616
      reports a homozygous nonsense allele in 2 siblings with high grade mosaic variegated aneuploidy
      and a second homozygous truncation in a third patient. The protein silences the spindle assembly
      checkpoint by disassembling MAD2 containing complexes, so it is a checkpoint component and the
      structural annotation rule admits it as well.
  CEP192:
    sets:
    - forced_genotyping_target_list
    evidence: PMID 37981762
    reason: A published mosaic aneuploidy gene that the frozen release links to no disease. PMID 37981762
      reports a biallelic CEP192 genotype in 2 siblings with mosaic variegated aneuploidy and tetraploidy.
      CEP192 is a centrosomal scaffold protein and not a spindle assembly checkpoint component, so the
      structural annotation rule excludes it.
  BUB1:
    sets:
    - structural_annotation_set
    evidence: ORPHA:1052 of the frozen release
    reason: A spindle assembly checkpoint component and a tier 2 panel gene on the Orphanet association.
      No published case carries a biallelic BUB1 genotype with a mosaic variegated aneuploidy diagnosis,
      so the evidence file scores it disputed and it enters this set on the checkpoint criterion alone.
  BUB3:
    sets:
    - structural_annotation_set
    evidence: ORPHA:1052 of the frozen release
    reason: A spindle assembly checkpoint component and a tier 2 panel gene on the Orphanet association.
      No published case carries a biallelic BUB3 genotype with a mosaic variegated aneuploidy diagnosis,
      so the evidence file scores it disputed and it enters this set on the checkpoint criterion alone.
  CDC20:
    sets:
    - structural_annotation_set
    evidence: PMID 33094908
    reason: A spindle assembly checkpoint component and the target of the checkpoint complex. The frozen
      release links CDC20 to no disease of the matching set. PMID 33094908 reports one de novo monoallelic
      missense allele with random chromosome number instability, which does not fit the recessive inheritance
      of the panel diseases, so this member rests on the checkpoint criterion.
  PTPA:
    sets:
    - structural_annotation_set
    evidence: None in the frozen release and no published human case
    reason: A regulator of protein phosphatase 2A, which acts on the checkpoint. The frozen release
      links PTPA to no disease of the matching set and no published human case carries a PTPA genotype
      with a phenotype of this class, so this member rests on the checkpoint criterion alone.
