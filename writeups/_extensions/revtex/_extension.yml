title: REVTeX 4.2 for Quarto
author: mva-hackathon-2026
version: 0.1.0
quarto-required: ">=1.8.0"
contributes:
  formats:
    pdf:
      documentclass: revtex4-2
      classoption: [aps, prx, twocolumn, reprint, superscriptaddress, nofootinbib]
      pdf-engine: pdflatex
      cite-method: natbib
      biblio-style: apsrev4-2
      number-sections: true
      fig-pos: "tbp"
      link-citations: true
      colorlinks: true
      template-partials:
        - partials/title.tex
        - partials/before-body.tex
        - partials/tables.tex
      filters:
        - filters/revtex_tables.lua
